<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shravan & Sheetal - Royal Wedding Invite</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel:wght@500;600;700&display=swap');

    :root {
      --bg-ivory: #fcf8f2;
      --bg-warm: #f4ece1;
      --gold-primary: #b8860b;
      --gold-light: #d4af37;
      --gold-border: rgba(184, 134, 11, 0.35);
      --text-dark: #3b250c;
      --text-muted: #5e4427;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      min-height: 100%;
      font-family: 'Playfair Display', serif;
      background-color: var(--bg-ivory);
      color: var(--text-dark);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    body.locked {
      overflow: hidden;
      height: 100dvh;
    }

    /* ==========================================
       STEP 1: WELCOME SCREEN (Desktop + Mobile)
       ========================================== */
    #welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 1000;
      background-color: var(--bg-ivory);
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: transform 0.85s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.85s ease;
      border: 8px double var(--gold-border);
      overflow-y: auto;
    }

    /* Mobile Portrait Banner (Hidden on wide desktop, shown on phones so both Bride & Groom are fully visible!) */
    .mobile-welcome-photo {
      display: none;
      width: 100%;
      max-width: 400px;
      height: 230px;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      border: 2px solid var(--gold-light);
      border-bottom: none;
      box-shadow: 0 8px 25px rgba(59, 37, 12, 0.12);
      background: #f4ece1;
      flex-shrink: 0;
    }

    .mobile-welcome-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .welcome-card {
      background: rgba(252, 248, 242, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid var(--gold-border);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 35px rgba(59, 37, 12, 0.15);
    }

    .mantra {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--gold-primary);
      margin-bottom: 16px;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    .monogram {
      width: 72px;
      height: 72px;
      border: 2px solid var(--gold-primary);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      background-color: rgba(252, 248, 242, 0.96);
      box-shadow: 0 4px 15px rgba(184, 134, 11, 0.15);
      flex-shrink: 0;
    }

    .monogram-text {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      color: var(--gold-primary);
      font-weight: 700;
    }

    .monogram-date {
      font-size: 0.55rem;
      color: var(--text-dark);
      letter-spacing: 0.8px;
      margin-top: 2px;
      font-weight: 600;
    }

    .intro-text {
      font-style: italic;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .names {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.55rem, 5vw, 2.3rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
      color: var(--text-dark);
      letter-spacing: 0.8px;
    }

    .names span {
      display: block;
      font-size: 1.25rem;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--gold-primary);
      margin: 3px 0;
    }

    .details {
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 22px;
      color: var(--text-muted);
    }

    .highlight {
      color: var(--gold-primary);
      font-weight: 700;
    }

    .enter-btn {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 14px 38px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(184, 134, 11, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      width: auto;
      min-width: 220px;
    }

    .enter-btn:active {
      transform: scale(0.97);
    }

    .footer-text {
      margin-top: 16px;
      font-size: 0.74rem;
      color: var(--text-muted);
      letter-spacing: 0.4px;
    }

    /* ==========================================
       STEP 2: MAIN INVITE & FUNCTION CARDS
       ========================================== */
    #main-invite {
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      background: radial-gradient(circle at top, #fffdf9 0%, #f7efe2 100%);
      padding-bottom: 60px;
    }

    #main-invite.visible {
      display: block;
      opacity: 1;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 90;
      background: rgba(252, 248, 242, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--gold-border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar-brand {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      color: var(--gold-primary);
      font-size: 0.92rem;
      letter-spacing: 1px;
    }

    .music-btn {
      background: #fff;
      border: 1px solid var(--gold-primary);
      color: var(--text-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Playfair Display', serif;
      box-shadow: 0 2px 8px rgba(184, 134, 11, 0.12);
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .hero-section {
      text-align: center;
      padding: 32px 10px 28px;
    }

    .sanskrit-sub {
      color: var(--gold-primary);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .jharokha-frame {
      width: 260px;
      height: 340px;
      margin: 0 auto 22px;
      padding: 8px;
      background: linear-gradient(135deg, #e5c158, #b8860b);
      border-radius: 140px 140px 16px 16px;
      box-shadow: 0 12px 30px rgba(59, 37, 12, 0.16);
    }

    .jharokha-inner {
      width: 100%;
      height: 100%;
      background: #fdfaf5;
      border-radius: 132px 132px 10px 10px;
      overflow: hidden;
    }

    .jharokha-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
    }

    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 0.98rem;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 24px;
      padding: 0 10px;
    }

    .countdown-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      max-width: 340px;
      gap: 10px;
      margin: 0 auto 32px;
    }

    .time-pill {
      background: #fff;
      border: 1px solid var(--gold-border);
      border-radius: 12px;
      padding: 10px 4px;
      box-shadow: 0 4px 12px rgba(184, 134, 11, 0.08);
    }

    .time-pill span {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-primary);
    }

    .time-pill small {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .section-header {
      text-align: center;
      margin: 12px 0 28px;
    }

    .section-header h2 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.45rem, 4.5vw, 1.85rem);
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .ornament-divider {
      width: 110px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent
