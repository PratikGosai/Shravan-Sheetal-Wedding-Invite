       ========================================================================= */

      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1500;

    .petal-toggle-floating {

      top: 14px;
      right: 14px;

      font-size: 0.76rem;
      font-weight: 600;

    .petal-toggle-floating:active {
      transform: scale(0.95);
    }

       PAGE 0: LANDING PAGE (9:16 Vertical Portrait Artwork Lock)
       ========================================================================= */

      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #3d1b0a 0%, #1a0b04 100%);
      transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.9s ease;
    }

    /* Locked 9:16 vertical container so text coordinates never shift on any phone or desktop */
    .landing-card-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * 9 / 16);
      max-height: calc(100vw * 16 / 9);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      background-color: #f9f1e4;
      container-type: inline-size;
    }

    /* On phones, fill the screen completely */
    @media (max-width: 600px) {
      .landing-card-stage {
        max-width: 100vw;
        max-height: 100vh;
        width: 100vw;
        height: 100vh;
      }
    }

    .landing-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

      left: 50%;
      transform: translateX(-50%);

      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
